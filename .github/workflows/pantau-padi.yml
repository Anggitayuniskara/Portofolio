name: Pantau hujan untuk padi Jawa

on:
  schedule:
    - cron: "0 3 22 * *"      # tanggal 22 setiap bulan, setelah CHIRPS bulan sebelumnya dirilis
  workflow_dispatch:          # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  pantau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/padi/requirements.txt
      - run: pip install -r pipeline/padi/requirements.txt
      - run: python pipeline/padi/pantau_hujan.py
      - name: Simpan hasil jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/padi-pantau.json
          git diff --staged --quiet || (git commit -m "Perbarui pemantauan hujan padi Jawa" && git push)
